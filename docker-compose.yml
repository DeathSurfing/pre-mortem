services:
  # Hindsight runs on Vectorize Cloud, so there is no memory container here.
  # Laya (the local System One classifier) is baked into the api image at build time, so there is no
  # model-serving container either. Three containers: api, web, and postgres (the prompt store).
  postgres:
    # pgvector is a hard requirement: the prompt store declares a `vector(384)` column, so a plain
    # postgres image would fail at `ensure_schema` and silently disable cross-referencing.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-premortem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premortem}
      POSTGRES_DB: ${POSTGRES_DB:-premortem}
    volumes:
      # Named volume, not a bind mount: losing this loses the prompt history, which is the point of it.
      - promptstore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premortem} -d ${POSTGRES_DB:-premortem}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No `expose` and no domain: reachable only on the compose network, by service name.

  api:
    build: ./api
    environment:
      # memory
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-https://api.hindsight.vectorize.io}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-premortem}
      HINDSIGHT_BIZ_BANK_ID: ${HINDSIGHT_BIZ_BANK_ID:-bizdecisions}
      # prompt store. Service name `postgres` resolves on the compose network.
      PROMPT_DB_URL: ${PROMPT_DB_URL:-postgresql://premortem:premortem@postgres:5432/premortem}
      # local embedding model for the prompt store; torch is already in the image for Laya.
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      # our own LLM calls (flip detail / review prose), streamed
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_SESSION: ${OPENCODE_SESSION:-pre-mortem-prod}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      # deliberately empty: the 9Router fallback lane returned "Model is unavailable" under load, and a
      # dead fallback doubles latency on every call.
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # Laya: local classifier. Weights are baked into the image; LAYA_LOCAL_DIR is exported by the
      # image entrypoint from /models/laya_path, so it is intentionally not set here.
      LAYA_ENABLED: ${LAYA_ENABLED:-1}
      LAYA_REPO: ${LAYA_REPO:-techtheist/laya-onnx}
      LAYA_SUBFOLDER: ${LAYA_SUBFOLDER:-en}
      LAYA_ONNX_FILE: ${LAYA_ONNX_FILE:-model_int4.onnx}
      MIN_PROOF: ${MIN_PROOF:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "8000"
    depends_on:
      # Not fatal if this is slow (the store degrades gracefully), but waiting avoids every early prompt
      # recording a failure and logs a clean startup instead.
      postgres:
        condition: service_healthy
    healthcheck:
      # start_period is generous on purpose: the first Laya load builds the ONNX session (~9s measured,
      # more on a cold host) and the healthcheck must not fail the container during that window.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  web:
    build:
      context: ./web
      # Next inlines NEXT_PUBLIC_* at BUILD time, so it must be a build arg, not only a runtime env.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

volumes:
  promptstore:

