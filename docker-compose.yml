services:
  # Hindsight runs on Vectorize Cloud (api.hindsight.vectorize.io), so there is no memory container.
  # Our LLM for the flip-detail sentence is OpenCode Go; Hindsight's own extraction model is chosen on
  # the Cloud side, which is the one thing we cannot configure there.
  api:
    build: ./api
    environment:
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-https://api.hindsight.vectorize.io}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-premortem}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_SESSION: ${OPENCODE_SESSION:-pre-mortem-prod}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      # left empty on purpose: the 9Router fallback lane returned "Model is unavailable" under load,
      # and a dead fallback doubles latency on every call.
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      NINEROUTER_URL: ${NINEROUTER_URL}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      MIN_PROOF: ${MIN_PROOF:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./web
      # Next inlines NEXT_PUBLIC_* at BUILD time, so it must be a build arg, not only a runtime env.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
