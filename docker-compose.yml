services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    environment:
      HINDSIGHT_API_LLM_PROVIDER: opencode-go
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-deepseek-v4-flash}
      HINDSIGHT_API_LLM_API_KEY: ${OPENCODE_GO_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      HINDSIGHT_API_LLM_TIMEOUT: "180"
      HINDSIGHT_API_LLM_MAX_RETRIES: "3"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-small-en-v1.5
    volumes:
      - hindsight-pg:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build: ./api
    environment:
      HINDSIGHT_API_URL: http://hindsight:8888
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-premortem}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_SESSION: ${OPENCODE_SESSION:-pre-mortem-prod}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gareebi}
      NINEROUTER_URL: ${NINEROUTER_URL}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      MIN_PROOF: ${MIN_PROOF:-1}
    expose:
      - "8000"
    depends_on:
      hindsight:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    depends_on:
      - api

volumes:
  hindsight-pg:
